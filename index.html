<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VRM 撮影＆レタッチ見積もり</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .header-img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    h1, h2, h3 {
      color: #2c3e50;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    img, video {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .label {
      font-weight: bold;
      margin-top: 8px;
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>

  <!-- ヘッダー（X用4月.jpg） -->
  <img src="X用4月.jpg" alt="メインビジュアル" class="header-img">

  <h1>VRM 撮影＆レタッチ ご案内</h1>

  <!-- ビフォーアフター動画エリア -->
  <div class="card">
    <h2>クオリティ変化（Before / After）</h2>
    <p>ライティングやエフェクト加工による仕上がりの違いをご確認いただけます。</p>
    <div class="media-grid">
      <div>
        <!-- 1つ目のビフォーアフター動画 -->
        <video controls autoplay loop muted playsinline>
          <source src="before_after_1.mp4" type="video/mp4">
          お使いのブラウザは動画再生に対応していません。
        </video>
        <div class="label">ビフォーアフター 例1</div>
      </div>
      <div>
        <!-- 2つ目のビフォーアフター動画 -->
        <video controls autoplay loop muted playsinline>
          <source src="before_after_2.mp4" type="video/mp4">
          お使いのブラウザは動画再生に対応していません。
        </video>
        <div class="label">ビフォーアフター 例2</div>
      </div>
    </div>
  </div>

  <!-- 2026夏用セットの見本 -->
  <div class="card">
    <h2>2026夏用セット 納品見本</h2>
    <p>「引きの写真」と「キラキラスチル」のサンプルイメージです。</p>
    <div class="media-grid">
      <div>
        <img src="2026_06_夏用_3000_2.jpg" alt="引きの写真の見本">
        <div class="label">引きの写真（全体構図）</div>
      </div>
      <div>
        <img src="2026_06_夏用_3000_3.jpg" alt="キラキラスチルの見本">
        <div class="label">キラキラスチル（アップ・エフェクト強調）</div>
      </div>
    </div>
  </div>

</body>
</html>
